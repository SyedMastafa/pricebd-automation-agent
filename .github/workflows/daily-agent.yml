name: PriceBD Daily Automation Agent

on:
  # Run every day at 03:00 UTC = 09:00 Bangladesh Time
  schedule:
    - cron: '0 3 * * *'
  
  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      goal:
        description: 'Agent goal'
        required: true
        default: 'full_daily_run'
        type: choice
        options:
          - full_daily_run
          - seo_only
          - content_only
          - social_only
          - reply_only

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python_agent/requirements.txt

      - name: Install dependencies
        working-directory: python_agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env from secrets
        working-directory: python_agent
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> .env
          echo "LLM_PROVIDER=groq" >> .env
          echo "BRAND_NAME=PriceBD" >> .env
          echo "WEB_APP_URL=https://pricebd.lovable.app" >> .env
          echo "BRAND_VOICE=Professional, clear, helpful, trustworthy, data-driven. Focus on helping Bangladeshi users find the best prices and deals." >> .env

      - name: Run PriceBD Agent
        working-directory: python_agent
        run: |
          GOAL="${{ github.event.inputs.goal || 'full_daily_run' }}"
          echo "Running agent with goal: $GOAL"
          python main.py "$GOAL"

      - name: Upload Report as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pricebd-daily-report-${{ github.run_number }}
          path: python_agent/last_report.md
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## PriceBD Agent Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Goal:** ${{ github.event.inputs.goal || 'full_daily_run' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          if [ -f python_agent/last_report.md ]; then
            echo "- **Report:** Available in Artifacts" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Report Preview" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -n 40 python_agent/last_report.md >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
